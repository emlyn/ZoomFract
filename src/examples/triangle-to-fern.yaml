info:
  title: Triangle to Fern
  author: Emlyn Corrin
  date: 2026
  description: Move the slider from the Sierpinski triangle to the fern. The three copies change size, position and rotation while the stem widens and fades in, staying connected to the top copy.

frame:
  width: 12
  radius: 6
  colour: "#444"
  wall: "#ddd"
  background: "#fff"
  padding: 12
  margin: 24

variables:
  - name: transition
    value: 0
    input: { type: slider, min: 0, max: 1, step: 0.01, label: Triangle to fern }
  - name: showStem
    value: true
    input: { type: checkbox, label: Show stem }
  - name: fernOffsetX
    value: 0.005215
  - name: fernOffsetY
    value: 0.07821
  - name: topPosition
    value:
      - transition * (-0.11 + fernOffsetX + 0.86 * ((0.11 - fernOffsetX) * cos(4*pi/180) + (1 - fernOffsetY) * sin(4*pi/180)))
      - (1 - transition) * 0.5 + transition * (-0.7 + fernOffsetY + 0.86 * ((1 - fernOffsetY) * cos(4*pi/180) - (0.11 - fernOffsetX) * sin(4*pi/180)))
  - name: stemBase
    value: [(-0.1 + fernOffsetX) * transition, -1 + fernOffsetY * transition]
  - name: stemTip
    value: topPosition + (0.5 + 0.36 * transition) * rotate(stemBase, 4 * transition)

view:
  aspect: auto
  coordinates:
    x: [-2.4/sqrt(3), 2.4/sqrt(3)]
    y: [-1.2, 1.2]

seed:
  colour: "rgb(68 * transition, 204 * transition, 68 * transition)"
  opacity: 0.01

shading:
  detail: 0.7

scene:
  - type: rect
    name: stem
    centre: (stemBase + stemTip) / 2
    width: max(0.00001, 0.02 * transition)
    height: distance(stemBase, stemTip)
    rotation: atan2((stemTip - stemBase).x, (stemTip - stemBase).y) * 180 / pi
    colour: "rgb(68 * transition, 204 * transition, 68 * transition)"
    opacity: transition * number(showStem)
  - type: zoom
    name: top
    glow: { colour: "rgb(68 * transition, 204 * transition, 68 * transition)", size: 0, opacity: 0.2 }
    scale: 0.5 + 0.36 * transition
    rotation: 4 * transition
    align:
      from: [0, 0]
      to: topPosition
  - type: zoom
    name: left
    glow: { colour: "rgb(68 * transition, 204 * transition, 68 * transition)", size: 0, opacity: 0.2 }
    scale: 0.5 - 0.18 * transition
    rotation: -80 * transition
    align:
      from: [0, 0]
      to:
        - -(1 - transition)/sqrt(3) + transition * (-0.11 + fernOffsetX + 0.32 * ((0.1 - fernOffsetX) * cos(80*pi/180) - (1 - fernOffsetY) * sin(80*pi/180)))
        - -(1 - transition) * 0.5 + transition * (-0.85 + fernOffsetY + 0.32 * ((0.1 - fernOffsetX) * sin(80*pi/180) + (1 - fernOffsetY) * cos(80*pi/180)))
  - type: zoom
    name: right
    glow: { colour: "rgb(68 * transition, 204 * transition, 68 * transition)", size: 0, opacity: 0.2 }
    scale: 0.5 - 0.18 * transition
    rotation: 80 * transition
    align:
      from: [0, 0]
      to:
        - (1 - transition)/sqrt(3) + transition * (-0.1 + fernOffsetX + 0.32 * ((0.1 - fernOffsetX) * cos(80*pi/180) + (1 - fernOffsetY) * sin(80*pi/180)))
        - -(1 - transition) * 0.5 + transition * (-0.7 + fernOffsetY + 0.32 * (-(0.1 - fernOffsetX) * sin(80*pi/180) + (1 - fernOffsetY) * cos(80*pi/180)))
