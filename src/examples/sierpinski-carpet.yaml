frame:
  width: 12
  radius: 6
  color: "#444"
  wall: "#ddd"
  background: "#fff"
  padding: 12
  margin: 24

view:
  aspect: 1
  resolution:
    height: 1200
  coordinates:
    x: [0, 3]
    y: [0, 3]

seed:
  color: "#000"

scene:
  - type: zoom
    name: bottom-left
    bottomLeft: [0, 0]
    topRight: [1, 1]
  - type: zoom
    name: bottom-centre
    bottomLeft: [1, 0]
    topRight: [2, 1]
  - type: zoom
    name: bottom-right
    bottomLeft: [2, 0]
    topRight: [3, 1]
  - type: zoom
    name: mid-left
    bottomLeft: [0, 1]
    topRight: [1, 2]
  - type: zoom
    name: mid-right
    bottomLeft: [2, 1]
    topRight: [3, 2]
  - type: zoom
    name: top-left
    bottomLeft: [0, 2]
    topRight: [1, 3]
  - type: zoom
    name: top-centre
    bottomLeft: [1, 2]
    topRight: [2, 3]
  - type: zoom
    name: top-right
    bottomLeft: [2, 2]
    topRight: [3, 3]
