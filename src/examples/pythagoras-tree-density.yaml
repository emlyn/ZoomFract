frame:
  width: 12
  radius: 6
  colour: "#444"
  wall: "#ddd"
  background: "#fff"
  padding: 12
  margin: 24

shading:
  mode: density
  scale: log
  colours:  # hit count or % of busiest
    0%: "#fef3c7"
    33.333%: "#f59e0b"
    66.667%: "#b91c1c"
    100%: "#1e1b4b"

view:
  aspect: 4/3
  resolution:
    height: 1200
  coordinates:
    x: [0, 4]
    y: [0, 3]

variables:
  - name: size
    value: 0.6
  - name: shift
    value: 0.41
  - name: shifty
    value: 0.1
  - name: left
    value: 3/5
  - name: right
    value: 4/5
  - name: cosa
    value: (left^2 + 1 - right^2) / (2 * left)
  - name: sina
    value: sin(acos(cosa))

scene:
  - type: rect
    name: base
    bottomLeft: [view.right*shift-size/2, view.top * shifty]
    topRight: [view.right*shift+size/2, view.top * shifty + size]
  - type: zoom
    align:
      - [base.bottomLeft, base.topLeft]
      - [base.bottomRight, [view.right*shift-size/2 + left * cosa * size, view.top * shifty + size + left * sina * size]]
  - type: zoom
    align:
      - [base.bottomRight, base.topRight]
      - [base.bottomLeft, [view.right*shift-size/2 + left * cosa * size, view.top * shifty + size + left * sina * size]]
