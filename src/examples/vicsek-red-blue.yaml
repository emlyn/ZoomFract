info:
  title: Vicsek Red Blue
  author: Emlyn Corrin
  date: 2026
  description: A Vicsek cross with sharper red and blue glows on alternate arms.
  links:
    - https://en.wikipedia.org/wiki/Vicsek_fractal

frame:
  width: 12
  radius: 6
  colour: "#444"
  wall: "#ddd"
  background: "#fff"
  padding: 12
  margin: 24

view:
  aspect: 1
  overflow: 0.02
  coordinates:
    x: [0, 3]
    y: [0, 3]

seed:
  colour: "#000"

scene:
  - type: zoom
    name: top
    bottomLeft: [1, 2]
    scale: 1/3
    glow:
      colour: "#c00"
      size: 0.01
      softness: 0.7
  - type: zoom
    name: left
    bottomLeft: [0, 1]
    scale: 1/3
    glow:
      colour: "#00c"
      size: 0.01
      softness: 0.7
  - type: zoom
    name: mid
    bottomLeft: [1, 1]
    scale: 1/3
  - type: zoom
    name: right
    bottomLeft: [2, 1]
    scale: 1/3
    glow:
      colour: "#00c"
      size: 0.01
      softness: 0.7
  - type: zoom
    name: bottom
    bottomLeft: [1, 0]
    scale: 1/3
    glow:
      colour: "#c00"
      size: 0.01
      softness: 0.7
