info:
  title: Fern
  author: Emlyn Corrin
  date: 2026
  description: Three scaled, rotated zooms aligned to the top of a stem.
  links:
    - https://en.wikipedia.org/wiki/Barnsley_fern

frame:
  width: 12
  radius: 6
  colour: "#444"
  wall: "#ddd"
  background: "#fff"
  padding: 12
  margin: 24

view:
  aspect: 0.8
  coordinates:
    x: [-0.8, 0.8]
    y: [-1, 1]

shading:
  detail: 0.7

scene:
  - type: rect
    name: stem
    bottomLeft: [-0.11, -1]
    topRight: [-0.09, -0.7]
    colour: "#4c4"
  - type: zoom
    name: top
    scale: 0.86
    align: [stem.bottomLeft, stem.topLeft]
    rotation: 4deg
  - type: zoom
    name: left
    scale: 0.32
    align: [stem.bottom, stem.left]
    rotation: -80deg
  - type: zoom
    name: right
    scale: 0.32
    align: [stem.bottom, stem.top]
    rotation: 80deg