frame:
  width: 12
  radius: 6
  color: "#444"
  wall: "#ddd"
  background: "#fff"
  padding: 12
  margin: 24

view:
  aspect: 2/sqrt(3)
  resolution:
    height: 1200
  coordinates:
    x: [-1, 1]
    y: [-1, 1]

seed:
  color: "#000"

scene:
  - type: zoom
    name: bottom-left
    bottomLeft: [-1, -1]
    topRight: [0, 0]
  - type: zoom
    name: bottom-right
    bottomLeft: [0, -1]
    topRight: [1, 0]
  - type: zoom
    name: top
    bottomLeft: [-0.5, 0]
    topRight: [0.5, 1]
